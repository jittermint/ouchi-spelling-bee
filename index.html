<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="おうち Spelling Bee"><title>おうち Spelling Bee</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f4f6f8}body{margin:0;padding:20px}.app{max-width:720px;margin:0 auto}h1{margin:0 0 8px;font-size:30px}.sub{color:#666;margin-bottom:18px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:14px}.word{font-size:42px;font-weight:700;letter-spacing:.5px;text-align:center;margin:14px 0;min-height:52px}.question-word{font-size:34px;color:#777}button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:#222;color:#fff}.secondary{background:#e9edf2;color:#222}input{width:100%;box-sizing:border-box;padding:14px;border:2px solid #d9dee5;border-radius:12px;font-size:22px;text-align:center}input:focus{outline:none;border-color:#666}.hint{margin-top:12px;padding:12px;border-radius:10px;background:#f5f7fa}.hidden{display:none}.result{font-size:20px;font-weight:700;margin-top:14px;min-height:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f8fa;border-radius:12px;padding:12px;text-align:center}.num{font-size:24px;font-weight:700}.small{font-size:13px;color:#666}.mistakes li{margin:6px 0}@media(max-width:520px){body{padding:12px}.word{font-size:34px}.stats{grid-template-columns:1fr 1fr 1fr}button{flex:1}}
</style></head><body><div class="app"><h1>📝 おうち Spelling Bee</h1><div class="sub">英単語を聞いて、日本語ヒントを手がかりにスペルを答えよう。</div><div class="card"><div class="small">Question</div><div id="word" class="word question-word">？？？</div><div class="row"><button id="speakBtn" class="secondary">🔊 単語を聞く</button><button id="jpBtn" class="secondary">🇯🇵 日本語ヒント</button><button id="defBtn" class="secondary">📖 英語の意味</button></div><div id="jpHint" class="hint hidden"></div><div id="defHint" class="hint hidden"></div></div><div class="card"><input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="スペルを入力"><div class="row" style="margin-top:12px"><button id="checkBtn" class="primary">答える</button><button id="nextBtn" class="secondary">次の問題</button></div><div id="result" class="result"></div></div><div class="card"><div class="stats"><div class="stat"><div class="small">正解</div><div id="correct" class="num">0</div></div><div class="stat"><div class="small">回答数</div><div id="total" class="num">0</div></div><div class="stat"><div class="small">正解率</div><div id="rate" class="num">0%</div></div></div></div><div class="card"><strong>間違えた単語</strong><ul id="mistakes" class="mistakes"><li>まだありません</li></ul></div></div><script>
const words=[
["apple","りんご","a round fruit that is often red, green, or yellow"],["animal","動物","a living thing such as a dog, cat, or bird"],["answer","答え","something you say or write in reply to a question"],["beautiful","美しい","very nice to look at"],["because","なぜなら","for the reason that"],["birthday","誕生日","the day each year when a person was born"],["brother","兄、弟","a boy or man who has the same parents as you"],["building","建物","a structure such as a house, school, or office"],["butterfly","チョウ","an insect with four colorful wings"],["calendar","カレンダー","a chart that shows the days, weeks, and months of a year"],["careful","注意深い","thinking about what you are doing so you do not make mistakes"],["children","子どもたち","young people; more than one child"],["climbing","登ること","going up something such as a mountain or tree"],["country","国","a nation with its own government and borders"],["different","違った","not the same"],["difficult","難しい","not easy"],["elephant","ゾウ","a very large animal with a trunk"],["favorite","お気に入りの","liked more than all the others"],["football","サッカー","a sport played by two teams that try to kick a ball into a goal"],["friend","友達","a person you like and trust"],["garden","庭","a place where flowers, vegetables, or trees are grown"],["girl","女の子","a female child"],["happiness","幸福、幸せ","the feeling of being happy"],["hospital","病院","a place where sick or injured people receive medical care"],["important","重要な","having great value or importance"],["interesting","興味深い、おもしろい","something that keeps your attention because it is enjoyable or unusual"],["jungle","ジャングル","a thick tropical forest"],["kitchen","台所","a room where food is prepared and cooked"],["language","言語","a system of words used by people to communicate"],["library","図書館","a place where books and other materials can be borrowed or read"],["mountain","山","a very high natural landform"],["morning","朝","the early part of the day"],["picture","絵、写真","an image of something, made or photographed"],["question","質問","a sentence used to ask for information"],["remember","覚えている","to keep something in your mind or bring it back to mind"],["school","学校","a place where children learn"],["shoulder","肩","the part of the body between the neck and arm"],["special","特別な","different from or more important than usual"],["summer","夏","the warmest season of the year"],["teacher","先生","a person who helps students learn"],["together","一緒に","with each other"],["umbrella","傘","a thing used to protect you from rain"],["vegetable","野菜","a plant or part of a plant used as food"],["weather","天気","the condition of the air outside, such as sunny or rainy"],["winter","冬","the coldest season of the year"]].map(([w,jp,def])=>({w,jp,def}));
let current=null,correct=0,total=0;const mistakes=new Map();function pickQuestion(){current=words[Math.floor(Math.random()*words.length)];word.textContent="？？？";answer.value="";result.textContent="";jpHint.classList.add("hidden");defHint.classList.add("hidden");answer.focus()}function speak(t){if(!("speechSynthesis"in window)){alert("このブラウザでは音声機能を利用できません。");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.78;speechSynthesis.speak(u)}function check(){if(!current)return;const v=answer.value.trim().toLowerCase();if(!v)return;total++;if(v===current.w){correct++;result.textContent="✅ Correct!"}else{mistakes.set(current.w,(mistakes.get(current.w)||0)+1);result.textContent="❌ 正解は "+current.w}word.textContent=current.w;word.classList.remove("question-word");speak(current.w);updateStats();renderMistakes()}function updateStats(){correctEl.textContent=correct;totalEl.textContent=total;rate.textContent=total?Math.round(correct/total*100)+"%":"0%"}function renderMistakes(){const el=document.getElementById("mistakes"),arr=[...mistakes.entries()].sort((a,b)=>b[1]-a[1]);el.innerHTML=arr.length?arr.map(([w,n])=>"<li><strong>"+w+"</strong> × "+n+"</li>").join(""):"<li>まだありません</li>"}speakBtn.onclick=()=>current&&speak(current.w);jpBtn.onclick=()=>{if(current){jpHint.textContent="ヒント： "+current.jp;jpHint.classList.toggle("hidden")}};defBtn.onclick=()=>{if(current){defHint.textContent="Definition: "+current.def;defHint.classList.toggle("hidden")}};checkBtn.onclick=check;nextBtn.onclick=pickQuestion;answer.onkeydown=e=>{if(e.key==="Enter")check()};if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});const correctEl=document.getElementById("correct"),totalEl=document.getElementById("total"),rate=document.getElementById("rate");pickQuestion();
</script></body></html>
